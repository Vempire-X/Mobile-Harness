name: Android Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image already ships the Android SDK; installing the
      # pinned NDK/CMake here keeps the native PRoot build reproducible.
      - name: Install NDK, CMake and platform packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release signing stays byte-for-byte identical to the local workflow:
      # app/build.gradle.kts only signs when all four MH_UPLOAD_* values exist.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MH_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            {
              echo "MH_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks"
              echo "MH_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
              echo "MH_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "MH_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "::warning::Signing secrets are not configured. The APK will be built unsigned."
          fi

      - name: Assemble online release APK
        run: ./gradlew --no-daemon --stacktrace assembleOnlineRelease

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/online/release/*.apk out/mobile-harness-online.apk
          sha256sum out/mobile-harness-online.apk | tee out/mobile-harness-online.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-apk
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
